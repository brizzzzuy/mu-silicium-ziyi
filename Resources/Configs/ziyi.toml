# Xiaomi 13 Lite / ziyi (SM7450 / Diwali).
[boot_shim]
requires_kernel_header = true

[uefi_fd]
base = 0xA7100000
size = 0x300000

# The device uses an uncompressed ARM64 Image and Android boot header v4.
[boot_image_kernel]
kernel_compression = "none"
append_dtb = true

[boot_image]
header_version = 4
